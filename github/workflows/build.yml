
name: Build PARVATHI Billing APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir app
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip "$ZIP_FILE" -d app
          cd app
          flutter create --platforms=android --org com.parvathi .
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parvathi-billing-demo
          path: app/build/app/outputs/flutter-apk/app-release.apk
